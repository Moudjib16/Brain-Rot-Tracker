<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain Rot Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1 class="title">Brain Rot Tracker</h1>
        <p class="subtitle" id="date-label">Today</p>
      </header>

      <section class="card card-scrolls">
        <span class="card-label">Videos scrolled</span>
        <span class="card-value" id="scrolled-count">0</span>
      </section>

      <section class="card card-time">
        <span class="card-label">Active time</span>
        <span class="card-value card-value-mono" id="active-time">00:00:00</span>
      </section>

      <section class="breakdown" id="breakdown" hidden>
        <h2 class="breakdown-title">
          By platform
          <span class="breakdown-meta">last 7 days</span>
        </h2>
        <ul class="site-list" id="site-list"></ul>
      </section>

      <button class="reset-button" id="reset-stats" type="button">Reset today</button>

      <div class="export-row">
        <button class="link-button" id="export-csv" type="button">Export CSV</button>
        <span class="export-divider" aria-hidden="true">·</span>
        <button class="link-button" id="export-json" type="button">Export JSON</button>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
