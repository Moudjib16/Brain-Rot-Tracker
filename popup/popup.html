<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain Rot Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div class="header-text">
          <h1 class="title">Brain Rot Tracker</h1>
          <p class="subtitle" id="date-label">Today</p>
        </div>
      </header>

      <div class="stat-grid">
        <section class="card card-scrolls">
          <span class="card-label">Videos scrolled</span>
          <span class="card-value" id="scrolled-count" aria-live="polite" aria-atomic="true">0</span>
        </section>

        <section class="card card-time">
          <span class="card-label">Active time</span>
          <span class="card-value card-value-mono" id="active-time" aria-live="polite" aria-atomic="true">00:00:00</span>
        </section>
      </div>

      <section class="panel" aria-labelledby="week-heading">
        <div class="panel-head">
          <h2 class="panel-title" id="week-heading">Last 7 days</h2>
          <span class="panel-meta" id="week-summary"></span>
        </div>
        <ol
          class="chart"
          id="week-chart"
          aria-label="Videos per day over the last 7 days"
        ></ol>
        <p class="streak" id="streak" hidden></p>
      </section>

      <section class="panel" id="breakdown" aria-labelledby="sites-heading" hidden>
        <div class="panel-head">
          <h2 class="panel-title" id="sites-heading">By platform</h2>
          <span class="panel-meta">last 7 days</span>
        </div>
        <ul class="site-list" id="site-list"></ul>
      </section>

      <button class="button button-secondary" id="reset-stats" type="button">
        Reset today
      </button>

      <div class="export-row">
        <button class="link-button" id="export-csv" type="button">Export CSV</button>
        <span class="export-divider" aria-hidden="true">·</span>
        <button class="link-button" id="export-json" type="button">Export JSON</button>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite" hidden>
        <span class="toast-message" id="toast-message"></span>
        <button class="toast-action" id="toast-action" type="button" hidden></button>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
